# Local-only routing. The single receiver is a loopback webhook that writes JSONL
# (ops/alert_receiver.py). No external notification integrations are configured.
# group_wait is deliberately short (5 s) so alert receipt fits the 45 s acceptance budget.
route:
  receiver: local-jsonl
  group_by: [alertname, instance, backend, workload]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 10m

receivers:
  - name: local-jsonl
    webhook_configs:
      - url: "http://127.0.0.1:9094/alerts"
        send_resolved: true
        max_alerts: 0
