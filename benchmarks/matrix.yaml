# Baseline experiment matrix (spec: 2 backends x 3 batch sizes x 3 concurrency = 18 cells,
# 3 independent trials per cell = 54 measured runs). Freeze before final evaluation.
experiment: baseline-v1
seed: 20261110            # trial order is shuffled with this seed and recorded in plan.json
backends:
  cpu:  {url: "http://127.0.0.1:8001", expect: cpu}
  gpu:  {url: "http://127.0.0.1:8000", expect: cuda}
batch_sizes: [1, 8, 32]
concurrency: [1, 4, 8]
trials: 3
warmup_requests: 20
duration_s: 60            # minimum measured time per run
cooldown_s: 5             # idle gap between runs (records thermal / contention context)
prometheus: "http://127.0.0.1:9090"
