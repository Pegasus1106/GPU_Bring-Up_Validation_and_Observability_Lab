global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    lab: gpu-workload-lab
rule_files:
- /home/tuttare/P_3/monitoring/rules/*.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 127.0.0.1:9093
scrape_configs:
- job_name: inference
  file_sd_configs:
  - files:
    - /home/tuttare/P_3/artifacts/native/run/targets/inference.yml
    refresh_interval: 5s
- job_name: dcgm-exporter
  file_sd_configs:
  - files:
    - /home/tuttare/P_3/artifacts/native/run/targets/dcgm.yml
    refresh_interval: 5s
- job_name: node-exporter
  static_configs:
  - targets:
    - 127.0.0.1:43055
- job_name: lab-controller
  static_configs:
  - targets:
    - 127.0.0.1:9105
- job_name: alertmanager
  static_configs:
  - targets:
    - 127.0.0.1:9093
- job_name: prometheus
  static_configs:
  - targets:
    - 127.0.0.1:9090
